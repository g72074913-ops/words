<style>
:root{--bg:#C8AEF0;--card:#FFFBFD;--acc:#E89EB8;--tx:#3B2A52;--on:#33204A;--deep:#7B3A98;--soft:rgba(255,255,255,.4);--line:rgba(255,255,255,.55);--mut:rgba(59,42,82,.76);--grad:linear-gradient(135deg,#FFB3DC 0%,#C9A8F8 100%);--pnl:linear-gradient(135deg,rgba(255,255,255,.44) 0%,rgba(255,255,255,.14) 46%,rgba(255,255,255,.22) 100%);--glow:0 0 26px -4px rgba(255,170,225,.42);--sh:inset 0 1px 0 rgba(255,255,255,.8),inset 0 0 22px rgba(255,255,255,.16),0 0 26px -4px rgba(255,170,225,.4),0 22px 44px -22px rgba(70,40,150,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#C8AEF0;color:var(--tx);font:16px/1.5 Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 38% at 92% 4%,rgba(255,255,255,.6),transparent 62%),radial-gradient(60% 40% at 0% 100%,rgba(255,168,214,.9),transparent 68%),radial-gradient(60% 45% at 100% 62%,rgba(140,120,240,.55),transparent 70%),linear-gradient(165deg,#B5A1EE 0%,#C6ADF1 36%,#E1B4E5 70%,#F3BCDA 100%)}
body::after{content:"";position:fixed;inset:-20% -10%;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.15) 40%,transparent 52%),linear-gradient(115deg,transparent 58%,rgba(255,255,255,.1) 66%,transparent 74%)}
#app{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 114px)}
header{display:flex;align-items:center;gap:10px;margin-bottom:26px}
header img{width:36px;height:36px;border-radius:11px;box-shadow:0 0 18px rgba(255,170,225,.7)}
.wm{font-size:19px;font-weight:600;letter-spacing:-.03em}
header .hs{margin-left:auto;font-size:13px;color:var(--mut)}
.rnd{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--pnl);box-shadow:var(--sh);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.rnd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.seg,.seg2{display:flex;gap:2px;background:rgba(255,255,255,.26);border:1px solid var(--line);border-radius:99px;padding:3px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.seg button,.seg2 button{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer}
.seg button.on,.seg2 button.on{color:var(--on);background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:0 0 16px rgba(255,170,225,.6)}
.seg2{margin-bottom:14px;padding:4px}.seg2 button{flex:1;font-size:14px;font-weight:600;padding:9px 0}
h2{font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin:0 0 22px}
.lab{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:10px}
.muted{color:var(--mut);font-size:14px}.hide{display:none}
.card,.hero,.stats,.sec,#wl,.dz{position:relative;background:var(--pnl);border:1px solid rgba(255,255,255,.6);border-radius:30px;box-shadow:var(--sh);backdrop-filter:blur(24px) saturate(1.35);-webkit-backdrop-filter:blur(24px) saturate(1.35)}
.card{padding:22px;margin-bottom:12px}
.hero{padding:28px 26px;margin-bottom:12px}.due{font-size:92px;font-weight:300;letter-spacing:-.07em;line-height:.95;margin:0;text-shadow:0 0 30px rgba(255,255,255,.6)}.dl{margin:8px 0 22px;color:var(--mut)}
.stats{display:flex;margin-bottom:12px}.stats>div{flex:1;padding:18px 8px 16px;text-align:center;border-left:1px solid rgba(255,255,255,.5)}.stats>div:first-child{border:0}
.stats b{display:block;font-size:30px;font-weight:300;letter-spacing:-.04em;line-height:1.1}.stats span{font-size:13px;color:var(--mut)}
.sec{padding:20px 22px;margin-bottom:12px}.sec .item:last-child{padding-bottom:0}
.mnum{font-size:44px;font-weight:300;letter-spacing:-.05em;line-height:1}
input,textarea,select{width:100%;background:rgba(255,255,255,.42);color:var(--tx);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:13px 16px;font:inherit;outline:0;transition:border-color .2s,box-shadow .2s,background-color .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
input::placeholder,textarea::placeholder{color:rgba(59,42,82,.55)}
textarea{resize:vertical;min-height:160px}
input:focus,textarea:focus,select:focus{background:rgba(255,255,255,.65);border-color:#fff;box-shadow:0 0 0 3px rgba(255,170,225,.45),0 0 22px rgba(255,170,225,.55)}
input[type=checkbox]{accent-color:#7B3A98}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1 1 140px}.row>.btn{flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(255,255,255,.2));color:var(--tx);border:1px solid rgba(255,255,255,.65);border-radius:99px;padding:13px 24px;font:inherit;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .12s,box-shadow .2s}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 20px rgba(255,170,225,.5)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);color:var(--on);border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 0 24px rgba(255,160,225,.6),0 14px 26px -14px rgba(90,50,180,.75)}.btn.big{width:100%;padding:16px;font-size:16px}.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding:2px 2px 6px}.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1px solid rgba(255,255,255,.6);background:linear-gradient(145deg,rgba(255,255,255,.4),rgba(255,255,255,.14));color:var(--tx);border-radius:99px;padding:7px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.chipb.on{background:var(--grad);color:var(--on);box-shadow:0 0 18px rgba(255,160,225,.6)}
.sbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tm{font-size:36px;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.4);border-radius:6px;overflow:hidden;margin-bottom:20px}.bar i{display:block;height:100%;background:var(--grad);border-radius:6px;box-shadow:0 0 12px rgba(255,160,225,.9);transition:width 1s linear}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:12px}
.fc{perspective:1500px;cursor:pointer;margin:2px 0 18px;user-select:none;-webkit-user-select:none}
.fc-in{display:grid;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}.fc.flip .fc-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:330px;border-radius:34px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:linear-gradient(150deg,rgba(255,255,255,.55),rgba(255,255,255,.16) 55%,rgba(255,255,255,.28));border:1px solid rgba(255,255,255,.75);box-shadow:var(--sh)}
.face.back{transform:rotateY(180deg);background:linear-gradient(150deg,rgba(255,176,222,.55),rgba(170,150,245,.42) 60%,rgba(255,255,255,.25))}
.big{font-size:clamp(30px,8vw,46px);font-weight:500;letter-spacing:-.04em;line-height:1.15;word-break:break-word}.sub{font-size:16px;color:var(--mut);max-width:28em}
.say{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.2));color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 16px rgba(255,170,225,.5)}.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rate.two{grid-template-columns:repeat(2,1fr)}
.rt{flex-direction:column;gap:0;padding:12px 6px;border-radius:24px}.rt small{font-weight:500;color:inherit;opacity:.75;font-size:12px}
.rt.good{background:var(--grad);color:var(--on);border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 0 22px rgba(255,160,225,.55)}.rt.easy{background:linear-gradient(145deg,#5A3F7E,#3B2A52);color:#fff;border-color:rgba(255,255,255,.3)}
.q{font-size:24px;line-height:1.5;margin:4px 0 18px;font-weight:500;letter-spacing:-.02em}.gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--deep);box-shadow:0 6px 12px -8px rgba(255,160,225,1)}
mark{background:rgba(255,255,255,.62);color:var(--deep);border-radius:7px;padding:0 6px;font-weight:600}
.fb{margin-top:14px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.6)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 10px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--deep);vertical-align:middle}
.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.5)}.item:last-child{border:0}.item .t{flex:1;min-width:0}
.dz{border-style:dashed;border-color:rgba(255,255,255,.9);padding:24px;text-align:center;cursor:pointer;font-weight:600;margin-bottom:12px;transition:background-color .2s}.dz:hover,.dz.on{background:rgba(255,255,255,.4)}
#wl{padding:4px 22px;margin-bottom:12px}
details.wd{border-bottom:1px solid rgba(255,255,255,.5)}details.wd:last-child{border:0}
details.wd summary{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;list-style:none}details.wd summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px solid var(--deep)}.dot.l{background:rgba(123,58,152,.3)}.dot.k{background:rgba(123,58,152,.65)}.dot.m{background:var(--deep);box-shadow:0 0 8px rgba(255,160,225,.9)}
.edit{display:grid;gap:8px;padding:0 0 18px}.edit label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.sr{position:relative;margin-bottom:8px}.sr svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round}.sr input{padding-left:44px}
.sv{display:flex;align-items:baseline;gap:8px;margin:4px 0 18px}.sv b{font-size:76px;line-height:1;font-weight:300;letter-spacing:-.06em;text-shadow:0 0 28px rgba(255,255,255,.6)}.sv span{color:var(--mut);font-weight:500}
.stp{display:flex;gap:10px;margin-top:6px}.rb{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(255,255,255,.18));color:var(--tx);font:inherit;font-size:24px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}.rb:hover{box-shadow:0 0 18px rgba(255,170,225,.6)}.rb:active{transform:scale(.94)}
.sum{text-align:center}.sum svg.fw{width:50px;height:50px;margin-bottom:10px;filter:drop-shadow(0 0 10px rgba(255,160,225,.9))}.card .stats{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.g2 .card{margin:0}.col2{display:flex;flex-direction:column;gap:12px}.col2 .card{flex:1;padding:18px 20px}
.ringc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.ringc .lab{margin:10px 0 0}
.ringbox{position:relative;width:128px;height:128px}.ringbox svg{transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(255,150,225,.8))}.ringbox b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:300;letter-spacing:-.04em}
.kv b{display:block;font-size:clamp(24px,7.4vw,32px);white-space:nowrap;font-weight:300;letter-spacing:-.04em;line-height:1.1}.kv .lab{margin-bottom:6px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-bottom:2px}.chart i{flex:1;border-radius:7px;background:rgba(255,255,255,.4);min-height:4px}.chart i.on{background:linear-gradient(180deg,#FFB3DC,#A99BF2);box-shadow:0 0 12px rgba(255,160,225,.8)}
.cl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.stk{display:flex;height:14px;border-radius:9px;overflow:hidden;gap:2px;margin:6px 0 14px}.stk i{display:block;height:100%}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:14px}.lg span{display:flex;align-items:center;gap:8px}.lg em{font-style:normal;width:10px;height:10px;border-radius:50%;flex:none}
.c-n{background:rgba(255,255,255,.65)}.c-l{background:#F7A8D2}.c-k{background:#C4A6F8}.c-m{background:#7B5BD6;box-shadow:0 0 8px rgba(160,120,255,.8)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:rgba(51,32,74,.94);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:9;max-width:90%;box-shadow:0 0 20px rgba(255,160,225,.5)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(540px,calc(100% - 24px));padding:6px;background:var(--pnl);backdrop-filter:blur(26px) saturate(1.35);-webkit-backdrop-filter:blur(26px) saturate(1.35);border:1px solid rgba(255,255,255,.7);border-radius:32px;box-shadow:var(--sh);z-index:5}
nav div{display:flex;width:100%}
nav button{flex:1;background:none;border:0;color:var(--tx);opacity:.66;font:inherit;font-size:11px;font-weight:600;padding:8px 0;border-radius:26px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background-color .25s,color .25s}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{opacity:1;color:var(--deep);background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.4));box-shadow:inset 0 1px 0 #fff,0 0 20px rgba(255,160,225,.7)}
.pop{animation:pop .3s ease}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
@media(max-width:380px){.g2{grid-template-columns:1fr}.due{font-size:76px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function parseText(t){const ent=[];let cur=null;

const splitCtx=s=>String(s).split(/\n|\s\|\s/).map(x=>x.replace(/^\*|\*$/g,"").trim()).filter(Boolean);

function csvRows(t){const rows=[];let r=[],c="",qt=false;for(let i=0;i<t.length;i++){const ch=t[i];if(qt){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else qt=false}else c+=ch}else if(ch==='"')qt=true;else if(ch===","||ch===";"||ch==="\t"){r.push(c);c=""}else if(ch==="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}r.push(c);rows.push(r);return rows}

const names=Object.keys(f).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/g).pop())-parseInt(b.match(/\d+/g).pop())),rows=[];

if(t==="s"){const m=body.match(/<v>(\d+)<\/v>/);v=m?ss[+m[1]]||"":""}else if(t==="inlineStr"){v=[...body.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(m=>dec(m[1])).join("")}else{const m=body.match(/<v>([\s\S]*?)<\/v>/);v=m?dec(m[1]):""}r[col]=v}rows.push(Array.from(r,x=>x==null?"":x))}}return rows}
const PDFB=["https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/","https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/"];
async function pdfText(buf){let P=null;for(const b of PDFB){try{P=await import(b+"pdf.min.mjs");try{const w=await(await fetch(b+"pdf.worker.min.mjs")).text();P.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"}))}catch(e){P.GlobalWorkerOptions.workerSrc=b+"pdf.worker.min.mjs"}break}catch(e){P=null}}

$("#imp").onclick=()=>{let a=0,u=0;document.querySelectorAll("#prev input:checked").forEach(c=>{const r=addEntry(pend[+c.dataset.i],$("#bg").value.trim());r==="new"?a++:u++});save();chrome();$("#prev").innerHTML=`<div class="card">${L(`Added ${a}, updated ${u}.`,`Добавлено: ${a}, обновлено: ${u}.`)}<div class="row"><button class="btn pri" data-go="study">${L("Start studying","Начать тренировку")}</button></div></div>`;$("#bulk").value=""}};

const dz=$("#dz"),fi=$("#file");
const handle=async f=>{if(!f)return;$("#fs").textContent=L("Reading ","Читаю ")+f.name+"…";try{const r=await readFile(f);$("#fs").textContent="";if(r.rows)showPrev(parseRows(r.rows));else{$("#bulk").value=r.text.slice(0,300000);showPrev(parseText(r.text))}}catch(e){$("#fs").textContent=e.message}};
dz.onclick=()=>fi.click();fi.onclick=e=>e.stopPropagation();fi.onchange=e=>handle(e.target.files[0]);
["dragenter","dragover"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add("on")}));["dragleave","drop"].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove("on")}));
dz.addEventListener("drop",e=>handle(e.dataTransfer.files[0]))};

/* ---------- Words ---------- */
R.words=()=>{const tags=[...new Set(S.words.map(w=>w.tag).filter(Boolean))];
$("#v").innerHTML=`<h2>${L("Words","Слова")}</h2><div class="sr"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sq" placeholder="${L("Search","Поиск")}" value="${esc(q)}"></div><div class="row" style="margin-top:0"><select id="tf"><option value="">${L("All tags","Все теги")}</option>${tags.map(t=>`<option ${t===tagF?"selected":""}>${esc(t)}</option>`).join("")}</select><select id="so"><option value="new" ${sortF==="new"?"selected":""}>${L("Newest","Сначала новые")}</option><option value="weak" ${sortF==="weak"?"selected":""}>${L("Weakest first","Сначала слабые")}</option><option value="az" ${sortF==="az"?"selected":""}>A–Z</option></select></div><div id="wl"></div>
<div class="row" style="margin-top:24px"><button class="btn" id="e1">↓ TXT</button><button class="btn" id="e2">↓ JSON</button><label class="btn">↑ JSON<input id="im" type="file" accept=".json" class="hide"></label></div>`;
const Lst=()=>{let l=S.words.filter(w=>(!tagF||w.tag===tagF)&&(!q||(w.term+w.tr+w.def).toLowerCase().includes(q.toLowerCase())));
l=l.slice().sort((a,b)=>sortF==="az"?a.term.localeCompare(b.term):sortF==="weak"?weak(b)-weak(a):b.added-a.added);
$("#wl").innerHTML=l.length?l.map(w=>{const st=status(w);return`<details class="wd"><summary><span class="dot ${st[0]}" title="${st[1]}"></span><b>${esc(w.term)}</b><span class="muted" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.tr)}</span>${w.tag?`<span class="pill">${esc(w.tag)}</span>`:""}</summary><div class="edit" data-id="${w.id}"><label>${L("Word","Слово")}</label><input data-f="term" value="${esc(w.term)}"><label>${L("Definition","Определение")}</label><textarea data-f="def" rows="2" style="min-height:0">${esc(w.def)}</textarea><label>${L("Translation","Перевод")}</label><input data-f="tr" value="${esc(w.tr)}"><label>${L("Contexts","Контексты")}</label><textarea data-f="ctx" rows="3" style="min-height:0">${esc(w.ctx.join("\n"))}</textarea><label>${L("Tag","Тег")}</label><input data-f="tag" value="${esc(w.tag)}"><label>${L("Note","Заметка")}</label><input data-f="note" value="${esc(w.note||"")}"><div class="row"><button class="btn" data-sp="${w.id}">${L("Listen","Слушать")}</button><span class="muted" style="align-self:center">${st[1]} · ${w.lapses}×</span><button class="btn" data-del="${w.id}">${L("Delete","Удалить")}</button></div></div></details>`}).join(""):`<p class="muted" style="margin:14px 0">${L("Nothing here yet.","Пока пусто.")}</p><button class="btn pri" data-go="add" style="margin-bottom:14px">${L("Add words","Добавить слова")}</button>`};Lst();
$("#sq").oninput=e=>{q=e.target.value;Lst()};$("#tf").onchange=e=>{tagF=e.target.value;Lst()};$("#so").onchange=e=>{sortF=e.target.value;Lst()};
$("#wl").onchange=e=>{const f=e.target.dataset.f,box=e.target.closest(".edit");if(!f||!box)return;const w=S.words.find(x=>x.id===box.dataset.id);if(!w)return;const v=e.target.value.trim();
if(f==="ctx")w.ctx=splitCtx(e.target.value);else if(f==="term"){if(v)w.term=v;else e.target.value=w.term}else w[f]=v;save();chrome()};
$("#wl").onclick=e=>{const d=e.target.dataset.del,s=e.target.dataset.sp;if(s){const w=S.words.find(x=>x.id===s);if(w)speak(w.term)}
if(d&&confirm(L("Delete this word?","Удалить это слово?"))){S.words=S.words.filter(w=>w.id!==d);save();Lst();chrome()}};
$("#e1").onclick=()=>dl("vocabup-words.txt",S.words.map(w=>"• "+w.term+(w.def?" - "+w.def:"")+(w.tr?" ("+w.tr+")":"")+w.ctx.map(c=>" *"+c+"*").join("")).join("\n\n"),"text/plain");
$("#e2").onclick=()=>dl("vocabup-backup.json",JSON.stringify(S),"application/json");
$("#im").onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.words))throw 0;let n=0;d.words.forEach(w=>{if(w.term&&!S.words.some(x=>x.term.toLowerCase()===w.term.toLowerCase())){S.words.push(Object.assign({id:uid(),def:"",tr:"",ctx:[],tag:"",note:"",added:Date.now()},fresh(),w));n++}});save();toast(L(`Restored ${n}`,`Восстановлено: ${n}`));go("words")}catch(x){toast(L("Invalid file","Неверный файл"))}};r.readAsText(e.target.files[0])}};

/* ---------- Study ---------- */
function ctxFor(w){const o=[];(w.ctx||[]).forEach(c=>{const b=c.match(/\[([^\]]+)\]/);
if(b){o.push({clean:c.replace(/\[([^\]]+)\]/,"$1").replace(/[\[\]]/g,""),gap:c.replace(/\[[^\]]+\]/,"_____").replace(/[\[\]]/g,""),target:b[1]})}
else{const m=c.match(new RegExp("\\b"+rx(w.term)+"\\w*","i"));if(m)o.push({clean:c,gap:c.replace(m[0],"_____"),target:m[0]})}});return o}
function typesFor(w,mode){const t=[];if(ctxFor(w).length)t.push("cloze");if(w.def)t.push("w2d","d2w");if(w.tr)t.push("w2t","t2w");if(mode==="all")return t;const r=t.filter(x=>MODES[mode].includes(x));return mode==="def"&&S.defDir&&S.defDir!=="both"?r.filter(x=>x===S.defDir):r}
function sched(w,r){const o={ease:w.ease,reps:w.reps,lapses:w.lapses,interval:w.interval};
if(r===0){o.lapses++;o.reps=0;o.ease=Math.max(1.3,o.ease-.2);o.interval=3/1440}
else{const e=r===2;if(o.reps===0)o.interval=e?3:1;else if(o.reps===1)o.interval=e?6:3;else o.interval=Math.min(365,Math.max(Math.ceil(o.interval)+1,Math.round(o.interval*o.ease*(e?1.3:1))));o.reps++;if(e)o.ease=Math.min(3,o.ease+.1)}return o}
const fmtI=d=>{if(d<1){const m=Math.max(1,Math.round(d*1440));return L(m+" min",m+" мин")}return L(d+" d",d+" дн.")};
const fmtT=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function rate(w,r,type){Object.assign(w,sched(w,r));w.due=Date.now()+w.interval*DAY;w.seen=true;const s=w.st[type]||(w.st[type]=[0,0]);s[r===0?1:0]++;
const k=dkey();S.days[k]=(S.days[k]||0)+1;const lg=S.log[k]||(S.log[k]={n:0,ok:0,ms:0});lg.n++;if(r>0)lg.ok++;lg.ms+=Math.min(90000,Math.max(0,Date.now()-((cur&&cur.shownAt)||Date.now())));if(SES&&!SES.done){SES.n++;if(r>0)SES.ok++;SES.ids.add(w.id)}save()}
const wpick=(arr,f)=>{const ws=arr.map(f),t=ws.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}return arr[arr.length-1]};
function pickWord(){const p=S.words.filter(w=>(!SS.tag||w.tag===SS.tag)&&typesFor(w,SS.mode).length),now=Date.now();let c=p.filter(w=>w.due<=now);
if(!c.length)c=p.filter(w=>w.due<=now+10*MIN);if(!c.length&&SS.ahead)c=p.slice().sort((a,b)=>weak(b)-weak(a)).slice(0,8);
if(c.length>1&&SS.last)c=c.filter(w=>w.id!==SS.last);return{w:c.length?wpick(c,w=>weak(w)+Math.max(0,(now-w.due)/DAY)):null,pool:p}}
const newSession=()=>{SES={start:Date.now(),end:Date.now()+S.sess*MIN,n:0,ok:0,ids:new Set(),done:false}};
R.study=()=>{if(!SES||SES.done||(SES.n===0&&Date.now()>=SES.end))newSession();const tags=[...new Set(S.words.map(w=>w.tag).filter(Boolean))],tot=SES.end-SES.start;
$("#v").innerHTML=`<div class="sbar"><span class="tm" id="tm">${fmtT(Math.max(0,SES.end-Date.now()))}</span><span class="muted">${L("answers","ответов")}: <span id="sn">${SES.n}</span></span></div><div class="bar"><i id="pb" style="width:${Math.min(100,(1-(SES.end-Date.now())/tot)*100)}%"></i></div>
<div class="chips">${MODELBL.map(m=>`<button class="chipb ${SS.mode===m[0]?"on":""}" data-m="${m[0]}">${L(m[1],m[2])}</button>`).join("")}</div>${SS.mode==="def"?`<div class="seg2" id="dd">${[["w2d","Word → def.","Слово → опр."],["d2w","Def. → word","Опр. → слово"],["both","Both","Оба"]].map(x=>`<button data-dd="${x[0]}" class="${(S.defDir||"both")===x[0]?"on":""}" style="font-size:13px">${L(x[1],x[2])}</button>`).join("")}</div>`:""}${tags.length?`<select id="stg" style="margin-bottom:16px"><option value="">${L("All tags","Все теги")}</option>${tags.map(t=>`<option ${t===SS.tag?"selected":""}>${esc(t)}</option>`).join("")}</select>`:""}<div id="ex"></div>`;
document.querySelector(".chips").onclick=e=>{const b=e.target.closest("[data-m]");if(b){SS.mode=b.dataset.m;SS.ahead=false;R.study()}};
const dd=$("#dd");if(dd)dd.onclick=e=>{const b=e.target.closest("[data-dd]");if(b){S.defDir=b.dataset.dd;save();SS.ahead=false;R.study()}};
const sg=$("#stg");if(sg)sg.onchange=e=>{SS.tag=e.target.value;SS.ahead=false;R.study()};
clearInterval(TM);TM=setInterval(()=>{const el=$("#tm");if(!el||!SES){clearInterval(TM);return}const r=SES.end-Date.now();el.textContent=fmtT(Math.max(0,r));const pb=$("#pb");if(pb)pb.style.width=Math.min(100,(1-r/tot)*100)+"%";if(r<=0)clearInterval(TM)},1000);next()};
function summary(){SES.done=true;clearInterval(TM);const n=SES.n,acc=n?Math.round(SES.ok/n*100):0;
$("#ex").innerHTML=`<div class="card sum">${FW}<h2 style="margin-bottom:20px">${L("Session complete","Сессия завершена")}</h2><div class="stats" style="margin-bottom:22px"><div><b>${n}</b><span>${L("answers","ответов")}</span></div><div><b>${acc}%</b><span>${L("correct","верно")}</span></div><div><b>${SES.ids.size}</b><span>${L("words","слов")}</span></div></div><div class="row" style="justify-content:center"><button class="btn pri" id="ns">${L("New session","Новая сессия")}</button><button class="btn" data-go="home">${L("Home","Главная")}</button></div></div>`;
$("#ns").onclick=()=>R.study()}
function next(){const box=$("#ex"),sn=$("#sn");if(sn&&SES)sn.textContent=SES.n;
if(SES&&!SES.done&&Date.now()>=SES.end&&SES.n>0)return summary();
if(!S.words.length){box.innerHTML=`<div class="card"><p style="margin-top:0">${L("No words yet.","Слов пока нет.")}</p><button class="btn pri" data-go="add">${L("Add words","Добавить слова")}</button></div>`;return}
const{w,pool}=pickWord();
if(!pool.length){box.innerHTML=`<div class="card"><p style="margin-top:0">${L("No exercises for this mode yet.","Для этого режима пока нет заданий.")}</p><button class="btn pri" data-go="words">${L("Open words","Открыть слова")}</button></div>`;return}
if(!w){const nx=Math.min(...pool.map(x=>x.due));box.innerHTML=`<div class="card sum">${FW}<h2 style="margin-bottom:8px">${L("All done for now","На сейчас всё")}</h2><p class="muted" style="margin-top:0">${L("Next review in ","Следующее повторение через ")}${fmtI(Math.max(.01,(nx-Date.now())/DAY))}</p><button class="btn pri" id="ah">${L("Practice weakest words","Потренировать слабые слова")}</button></div>`;$("#ah").onclick=()=>{SS.ahead=true;next()};return}
card(w)}
function card(w){const ty0=typesFor(w,SS.mode),type=wpick(ty0,t=>{const s=w.st[t]||[0,0];return .5+(s[1]+1)/(s[0]+s[1]+2)});SS.last=w.id;cur={w,type,flipped:false,revealed:false,shownAt:Date.now()};const box=$("#ex"),lbl=`<span class="chip">${L(...TYPELBL[type])}</span>`;
const exs=(w.ctx||[]).map(c=>c.replace(/\[([^\]]+)\]/g,"$1")),ex=exs.length?exs[Math.floor(Math.random()*exs.length)]:"";
const hl=s=>esc(s).replace(new RegExp(rx(esc(w.term))+"\\w*","i"),m=>`<mark>${m}</mark>`);
const sp=t=>`<button class="say" data-say="${esc(t)}" aria-label="Speak">${SPK}</button>`;
if(type==="cloze"){const cs=ctxFor(w),c=cs[Math.floor(Math.random()*cs.length)];cur.c=c;
const hint=[w.tr,w.def].filter(Boolean).map(esc).join(" · ");
box.innerHTML=`<div class="card">${lbl}<p class="q">${esc(c.gap).replace("_____",'<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</p>${hint?`<p class="muted">${hint}</p>`:""}<input id="ans" placeholder="…" autocomplete="off" autocapitalize="off" autocorrect="off"><div class="row"><button class="btn pri" id="chk">${L("Check","Проверить")}</button><button class="btn" id="dk">${L("I don't know","Не знаю")}</button></div><div id="fb"></div></div>`;
const done=ok=>{document.querySelectorAll("#ans,#chk,#dk").forEach(e=>e.disabled=true);
const full=esc(c.clean).replace(new RegExp(rx(esc(c.target)),"i"),m=>`<mark>${m}</mark>`);
if(ok){$("#fb").innerHTML=`<div class="fb">${L("Correct","Верно")}<br>${full}</div><div class="rate two"><button class="btn rt good" data-r="1"><span>${L("Good","Хорошо")}</span><small>${fmtI(sched(w,1).interval)}</small></button><button class="btn rt easy" data-r="2"><span>${L("Easy","Легко")}</span><small>${fmtI(sched(w,2).interval)}</small></button></div>`;
$("#fb").onclick=e=>{const b=e.target.closest("[data-r]");if(b){rate(w,+b.dataset.r,type);next()}}}
else{rate(w,0,type);$("#fb").innerHTML=`<div class="fb"><b>${esc(c.target)}</b><br>${full}</div><button class="btn pri big" id="nx" style="margin-top:12px">${L("Next","Далее")}</button>`;$("#nx").onclick=next;$("#nx").focus()}};
$("#chk").onclick=()=>{const a=$("#ans").value.trim().toLowerCase();if(a)done(a===c.target.toLowerCase()||a===w.term.toLowerCase())};$("#dk").onclick=()=>done(false);$("#ans").onkeydown=e=>{if(e.key==="Enter")$("#chk").click()};$("#ans").focus();return}
const face=(cls,lab,main,sub,say)=>`<div class="face ${cls}"><span class="lab" style="margin:0">${lab}</span><div class="big">${main}</div>${sub?`<div class="sub">${sub}</div>`:""}${say?sp(say):""}</div>`;
const exH=ex?`“${hl(ex)}”`:"";let f,b;
if(type==="w2d"){f=face("front",L("Word","Слово"),esc(w.term),"",w.term);b=face("back",L("Definition","Определение"),esc(w.def),exH)}
if(type==="d2w"){f=face("front",L("Definition","Определение"),esc(w.def),"");b=face("back",L("Word","Слово"),esc(w.term),exH,w.term)}
if(type==="w2t"){f=face("front","EN",esc(w.term),"",w.term);b=face("back","RU",esc(w.tr),w.def?esc(w.def):exH)}
if(type==="t2w"){f=face("front","RU",esc(w.tr),"");b=face("back","EN",esc(w.term),w.def?esc(w.def):exH,w.term)}
const rb=(r,lab,cls)=>`<button class="btn rt ${cls}" data-r="${r}"><span>${lab}</span><small>${fmtI(sched(w,r).interval)}</small></button>`;
box.innerHTML=`${lbl}<div class="fc" id="fc"><div class="fc-in">${f}${b}</div></div><button class="btn big" id="flip">${L("Show answer","Показать ответ")}</button><div class="rate hide" id="rate">${rb(0,L("Again","Снова"),"again")}${rb(1,L("Good","Хорошо"),"good")}${rb(2,L("Easy","Легко"),"easy")}</div>`;
$("#fc").onclick=e=>{if(e.target.closest("[data-say]"))return;flip()};$("#flip").onclick=flip;
$("#rate").onclick=e=>{const x=e.target.closest("[data-r]");if(x){rate(w,+x.dataset.r,type);next()}}}
function flip(){if(!cur||cur.type==="cloze")return;cur.flipped=!cur.flipped;cur.revealed=true;$("#fc").classList.toggle("flip",cur.flipped);$("#rate").classList.remove("hide");$("#flip").textContent=L("Flip","Перевернуть")}
document.addEventListener("click",e=>{const s=e.target.closest("[data-say]");if(s){e.stopPropagation();speak(s.dataset.say)}},true);
document.addEventListener("keydown",e=>{if(tab!=="study"||!cur||cur.type==="cloze"||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;
if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}else if(cur.revealed&&"123".includes(e.key)&&e.key){const b=document.querySelector(`#rate [data-r="${+e.key-1}"]`);if(b)b.click()}});

/* ---------- Settings: session length only ---------- */
R.set=()=>{const P=[5,10,15,20,30,45];
$("#v").innerHTML=`<h2>${L("Settings","Настройки")}</h2><div class="card"><span class="lab">${L("Session length","Время тренировки")}</span><div class="sv"><b>${S.sess}</b><span>${L("min","мин")}</span></div><div class="chips" style="flex-wrap:wrap">${P.map(p=>`<button class="chipb ${p===S.sess?"on":""}" data-p="${p}">${p}</button>`).join("")}</div><div class="stp"><button class="rb" data-d="-1" aria-label="−">−</button><button class="rb" data-d="1" aria-label="+">+</button></div></div>`;
$("#v").onclick=e=>{const b=e.target.closest("[data-p],[data-d]");if(!b)return;S.sess=b.dataset.p?+b.dataset.p:Math.min(120,Math.max(1,S.sess+ +b.dataset.d));SES=null;save();R.set()}};

go("home");
</script></body></html>
